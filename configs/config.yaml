# EU AI Act question answering: data, retrieval and evaluation settings.

# The document: Regulation (EU) 2024/1689 (the AI Act), consolidated version of 27 July 2026,
# which includes the Digital Omnibus amendments (Regulation (EU) 2026/1744). Downloaded from
# the Publications Office (EUR-Lex itself refuses scripts) and pinned by SHA-256: a different
# file is refused, so a new version is a deliberate change. Reuse is allowed under Commission
# Decision 2011/833/EU with the source acknowledged; the consolidated text "has no legal
# effect" (its own disclaimer), so the service cites passages and gives no legal advice.
source:
  celex: 02024R1689-20260727
  title: "Regulation (EU) 2024/1689 (AI Act), consolidated text of 27 July 2026"
  url: http://publications.europa.eu/resource/celex/02024R1689-20260727
  headers:
    Accept: application/xhtml+xml
    Accept-Language: en   # without it the server answers 400 (checked 2026-10-26)
  sha256: 5e7719f77e8a606b257dc25958ee3222c4383300a5a34270a5b850a2ce8b8715
  path: data/raw/ai-act-02024R1689-20260727.xhtml
  units_path: data/processed/units.jsonl

# Chunking: `structural` keeps paragraphs and points whole (split only when longer than
# max_words, each part repeating a lead-in of up to max_lead_words); `window` cuts fixed word
# windows inside each article or annex. Both are compared on the development questions.
chunking:
  method: structural
  max_words: 220
  max_lead_words: 100
  window_words: 160
  overlap_words: 40
  header: true   # start each chunk with its article's citation, title and chapter

# Retrieval, as set before the first evaluation (2026-10-26); alternatives are compared on the
# development questions only.
retrieval:
  embedding: BAAI/bge-small-en-v1.5
  query_prefix: "Represent this sentence for searching relevant passages: "  # bge's query instruction
  mode: hybrid          # dense | bm25 | hybrid (reciprocal rank fusion)
  candidates: 30        # results per method before fusion, and before reranking
  rerank: true
  reranker: Xenova/ms-marco-MiniLM-L-6-v2
  k: 5                  # passages given to the model
  # CI regression gate on the development questions (make retrieval-gate): set 2026-10-26
  # from the reviewed development run (recall@5 0.86, MRR 0.81) minus about three questions,
  # so that a change that loses several answers fails, while CPU-to-CPU float noise does not.
  ci_gate: {recall@5: 0.80, mrr: 0.72}

# Evaluation, fixed before any question was scored (2026-10-26). Questions are split once into
# development (all design choices) and test (used once, at the end), at random within each
# question type.
evaluation:
  test_share: 0.4
  split_seed: 20261026

# Retrieval experiments (make retrieval-experiments), fixed before running them (2026-10-26).
# Each setting changes the configured retrieval above and is scored on the development
# questions. Rule: the highest recall@5 wins, but `as_set` is kept unless another setting beats
# it by more than `margin` (0.04 is about two of the ~50 answerable development questions);
# ties go to fewer words given to the model. Settings that only measure a component (e.g.
# without reranking) can win too: then the simpler pipeline is used.
retrieval_experiments:
  rule: {metric: recall@5, baseline: as_set, margin: 0.04, tie_break: words@5}
  settings:
    as_set: {}
    dense_only: {retrieval: {mode: dense}}
    bm25_only: {retrieval: {mode: bm25}}
    no_rerank: {retrieval: {rerank: false}}
    reranker_l12: {retrieval: {reranker: Xenova/ms-marco-MiniLM-L-12-v2}}
    bge_base: {retrieval: {embedding: BAAI/bge-base-en-v1.5}}
    window_chunks: {chunking: {method: window}}
    no_header: {chunking: {header: false}}

# --- Stage 2: answers -------------------------------------------------------------------------
# Open-weight models in GGUF files, pinned by SHA-256 and run with llama.cpp: the same file on
# the Mac (CPU, Docker) and on Kaggle's GPUs, so the evaluated model is the served one.
# `mac` marks the candidates for serving on the 8 GB Mac; the others show what larger models
# reach. All Apache 2.0. Fixed before any answer was generated (2026-10-26).
llama_cpp:
  tag: b11898   # release built on Kaggle (from source, for the GPU found there)
  context: 8192
models:
  qwen3.5-0.8b: {repo: bartowski/Qwen_Qwen3.5-0.8B-GGUF, file: Qwen_Qwen3.5-0.8B-Q4_K_M.gguf, sha256: fb044e93939a70469c905781334f5de1e6c8b608ced6cbc8c9249bd4127d9526, family: qwen, mac: true}
  qwen3.5-2b: {repo: bartowski/Qwen_Qwen3.5-2B-GGUF, file: Qwen_Qwen3.5-2B-Q4_K_M.gguf, sha256: 57a1085840f497d764a7fc5d346922dbde961efb54cc792ea81d694fd846a1d8, family: qwen, mac: true}
  gemma-4-e2b: {repo: google/gemma-4-E2B-it-qat-q4_0-gguf, file: gemma-4-E2B_q4_0-it.gguf, sha256: fa401b55b07ee70a54c6dae3903c783a6e65064312529ea57175cb5f8dec6634, family: gemma, mac: true}
  qwen3.5-4b: {repo: bartowski/Qwen_Qwen3.5-4B-GGUF, file: Qwen_Qwen3.5-4B-Q4_K_M.gguf, sha256: 13c16f426047e2de38cd075bdade4a7bcbc8c774384876f677740cda65f8a983, family: qwen, mac: true}
  qwen3.5-9b: {repo: bartowski/Qwen_Qwen3.5-9B-GGUF, file: Qwen_Qwen3.5-9B-Q4_K_M.gguf, sha256: d784ce9eda1a5a7b51e8f705a9e6310844bf4f173654d115823c775fdea56d43, family: qwen, mac: false}
  gemma-4-e4b: {repo: google/gemma-4-E4B-it-qat-q4_0-gguf, file: gemma-4-E4B_q4_0-it.gguf, sha256: 676c35070db6dbe52f93e9c864ee0fba4eddea94b9c875d9cb10daff453fbaee, family: gemma, mac: false}
  gemma-4-31b: {repo: google/gemma-4-31B-it-qat-q4_0-gguf, file: gemma-4-31B_q4_0-it.gguf, sha256: 179cfb99212709597eae5929112cfca677e1bbf566178b479ae1da0c4772874b, family: gemma, mac: false}

answers:
  prompt: prompts/answer_v1.txt   # the prompt version is its file name and SHA-256, logged per answer
  # smallest first (the selection rule prefers smaller models)
  candidates: [qwen3.5-0.8b, qwen3.5-2b, gemma-4-e2b, qwen3.5-4b, qwen3.5-9b, gemma-4-e4b]
  max_tokens: 400
  temperature: 0          # greedy for evaluation: the same answer every run (repeat runs come in stage 3)
  seed: 42
  thinking: false         # Qwen 3.5 and Gemma 4 can reason before answering; too slow on the Mac
  decline: "The AI Act passages provided do not answer this question."

# The judge: the largest model, from a different family than the Qwen candidates (a model
# tends to favour answers of its own family, so the Gemma rows are read with that caveat). Its
# agreement with a person's labels is measured on a sample before its scores are trusted.
judge:
  model: gemma-4-31b
  prompt: prompts/judge_v1.txt
  max_tokens: 300

# Choosing the served model, fixed before any answer was generated (2026-10-26). Among the `mac`
# candidates whose median answer time on the Mac is within `mac_seconds` (measured locally, same
# prompt and k), the highest development `score` wins (correct = 1, partial = 0.5, over all
# development questions, unanswerable included); a smaller model is kept unless a larger one
# scores more than `margin` higher.
selection: {metric: score, margin: 0.05, mac_seconds: 150}
